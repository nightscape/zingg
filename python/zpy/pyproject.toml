[project]
name = "zingg-py"
version = "0.6.0"
description = "Python port of the Zingg record-linkage core (from zscala)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "rapidfuzz>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[project.scripts]
zingg-py = "zingg_py.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zingg_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
