[project]
name = "cve-coverage"
version = "0.1.0"
description = "CVE-cluster -> ops-ticket coverage pipeline (cluster -> retrieve -> rerank -> judge)"
requires-python = ">=3.10"
# Embedder + reranker run locally via sentence-transformers (which pulls torch).
# Only the judge calls an OpenAI-compatible chat endpoint (stdlib urllib, no dep).
dependencies = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
]

[project.optional-dependencies]
# The `--cluster zingg` strategy needs the ported Zingg core (the sibling
# workspace member zingg-py) and pandas. The default `--cluster deterministic`
# strategy needs neither. The workspace root maps zingg-py to the local member.
zingg = [
    "zingg-py",
    "pandas>=2.0",
]

[project.scripts]
cve-coverage = "cve_coverage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cve_coverage"]
